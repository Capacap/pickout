[package]
name = "filepick"
version = "0.1.0"
edition = "2024"

[dependencies]
ashpd = { version = "0.13", default-features = false, features = [
    "backend",
    "file_chooser",
    "tokio",
    "tracing",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
percent-encoding = "2.3.2"
async-trait = "0.1.92"

[profile.release]
lto = "thin"
strip = true
