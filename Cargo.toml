[package]
name = "filepick"
version = "0.1.0"
edition = "2024"
# Let-chains, used throughout the dialog.
rust-version = "1.88"

[dependencies]
ashpd = { version = "0.13", default-features = false, features = [
    "backend",
    "file_chooser",
    "tokio",
    "tracing",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
percent-encoding = "2.3.2"
async-trait = "0.1.92"
mime_guess = "2"
nucleo-matcher = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
unicode-width = "0.2"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
tempfile = "3"
